detector:
  model: /data/models/yolov8n.pt
  confidence: 0.5
  device: cuda

classifier:
  model: hf-hub:imageomics/bioclip
  device: cuda
  top_k: 5
  classify_every_n_frames: 15

tracker:
  max_disappeared: 30
  iou_threshold: 0.3
  min_frames_to_report: 5

metadata:
  latitude: 40.7
  longitude: -73.5

species:
  list_file: data/species_lists/north_america_common.txt
  prompt_template: "a photo of a {species}"

output:
  results_dir: /data/results

webapp:
  upload_dir: /data/videos
