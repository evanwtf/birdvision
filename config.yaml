detector:
  model: /data/models/yolov8n.pt
  confidence: 0.4
  device: cuda

classifier:
  model: hf-hub:imageomics/bioclip
  device: cuda
  top_k: 5
  classify_every_n_frames: 15

tracker:
  max_disappeared: 90
  iou_threshold: 0.2
  min_frames_to_report: 8
  min_confidence_to_report: 0.6

metadata:
  latitude: 40.7
  longitude: -73.5
  ebird_db: /app/data/ebird_priors.db
  ebird_fips: US-NY-059   # Nassau County — change to nearest county if needed

scoring:
  # Weight classification events by proximity to frame center.
  # Higher = center detections count more. 0 = disable.
  center_weight_strength: 2.0

species:
  list_file: data/species_lists/north_america_common.txt
  prompt_template: "a photo of a {species}"

output:
  results_dir: /data/results

webapp:
  upload_dir: /data/videos
