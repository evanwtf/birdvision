[project]
name = "birdvision"
version = "0.1.0"
description = "Bird species identification from video using local computer vision models"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "authlib>=1.6.0",
    "bitsandbytes>=0.49.2",
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "numpy>=1.24.0",
    "open-clip-torch>=2.20.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "pyexiftool>=0.5.6",
    "python-multipart>=0.0.22",
    "pyyaml>=6.0.3",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "tqdm>=4.65.0",
    "transformers>=5.5.0",
    "ultralytics>=8.4.31",
    "uvicorn[standard]>=0.42.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
pi = [
    "hailort==4.23.0",   # Linux aarch64 + Python 3.13 only
                         # Wheel from Hailo developer zone (not PyPI)
                         # Install: uv python install 3.13 && uv sync --python 3.13 --group pi
]

[tool.pytest.ini_options]
testpaths = ["tests"]
