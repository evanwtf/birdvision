[project]
name = "birdvision"
version = "0.1.0"
description = "Bird species identification from video using local computer vision models"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.2",
    "jinja2>=3.1.6",
    "numpy>=1.24.0",
    "open-clip-torch>=2.20.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "pyexiftool>=0.5.6",
    "python-multipart>=0.0.22",
    "pyyaml>=6.0.3",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "tqdm>=4.65.0",
    "ultralytics>=8.4.31",
    "uvicorn[standard]>=0.42.0",
]
