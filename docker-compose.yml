services:

  # Web UI — upload videos and view results at http://localhost:3587
  web:
    build: .
    image: birdvision:latest
    runtime: nvidia
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - BIRDVISION_DEBUG=${BIRDVISION_DEBUG:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
    volumes:
      - ./config.yaml:/data/config.yaml:ro
      - ./api_tokens.yaml:/data/api_tokens.yaml:ro
      - ./data/local_priors.yaml:/app/data/local_priors.yaml:ro
      - ./videos:/data/videos
      - ./results:/data/results
      - ./models:/data/models
    ports:
      - "3587:3587"
    command: ["/usr/local/bin/uv", "run", "scripts/serve.py", "--config", "/data/config.yaml"]
    stop_grace_period: 30s

  # CLI batch runner — processes all videos in ./videos/assets/
  birdvision:
    build: .
    image: birdvision:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./config.yaml:/data/config.yaml:ro
      - ./data/local_priors.yaml:/app/data/local_priors.yaml:ro
      - ./videos:/data/videos:ro
      - ./results:/data/results
      - ./models:/data/models
    command: ["/usr/local/bin/uv", "run", "scripts/identify_videos.py", "/data/videos/assets", "--config", "/data/config.yaml"]
    stop_grace_period: 30s
    profiles: ["cli"]

  tuner:
    build: .
    image: birdvision:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./config.yaml:/data/config.yaml:ro
      - ./videos:/data/videos
      - ./results:/data/results
      - ./models:/data/models
    entrypoint: ["/usr/local/bin/uv", "run", "scripts/tune_single_video.py", "--config", "/data/config.yaml"]
    stop_grace_period: 30s
    profiles: ["tuner"]
