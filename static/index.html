<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BirdVision</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* --- Status bar --- */
  #status-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: calc(6px + env(safe-area-inset-top)) 12px 6px 12px;
    background: rgba(0,0,0,0.7);
    font-size: 13px;
    z-index: 10;
    flex-shrink: 0;
  }
  #status-bar .indicator {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  #status-bar .indicator.connected    { background: #4caf50; }
  #status-bar .indicator.disconnected { background: #f44336; }
  #status-bar .indicator.connecting   { background: #ff9800; }

  /* --- Camera viewport --- */
  #viewport {
    position: relative;
    flex: 1;
    overflow: hidden;
  }
  #camera {
    width: 100%;
    height: 100%;
    object-fit: contain;
    transform-origin: center center;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  #stream-btn {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(110px + env(safe-area-inset-bottom));
    z-index: 16;
    background: #4caf50;
    color: #fff;
    border: none;
    padding: 16px 40px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #stream-btn:active { background: #388e3c; }
  #stream-btn.hidden { display: none; }

  #stop-btn {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(110px + env(safe-area-inset-bottom));
    z-index: 16;
    background: #f44336;
    color: #fff;
    border: none;
    padding: 16px 40px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #stop-btn:active { background: #c62828; }
  #stop-btn.hidden { display: none; }

  #species-log {
    position: absolute;
    top: 8px;
    left: 8px;
    z-index: 14;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: calc(100% - 100px);
    overflow: hidden;
  }
  .species-entry {
    background: rgba(0, 0, 0, 0.65);
    color: #00ff88;
    font: bold 14px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: 4px 10px;
    border-radius: 6px;
    white-space: nowrap;
    transition: opacity 0.6s ease-out;
  }
  .species-entry.fading { opacity: 0; }

  #zoom-controls {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: calc(18px + env(safe-area-inset-bottom));
    z-index: 15;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    pointer-events: none;
  }
  #zoom-controls.hidden { display: none; }
  #zoom-controls button {
    width: 74px;
    height: 74px;
    border: none;
    border-radius: 12px;
    background: rgba(0,0,0,0.76);
    color: #fff;
    font-size: 42px;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    pointer-events: auto;
    touch-action: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #zoom-out-btn { justify-self: start; }
  #zoom-in-btn { justify-self: end; }
  #zoom-controls button:active { background: rgba(60,60,60,0.86); }
  #zoom-controls button:disabled {
    color: #888;
    background: rgba(0,0,0,0.45);
    cursor: default;
  }
  #zoom-label {
    min-width: 54px;
    padding: 8px 12px;
    border-radius: 8px;
    background: rgba(0,0,0,0.72);
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    text-align: center;
    pointer-events: none;
  }

  /* --- Start button --- */
  #start-screen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    background: rgba(0,0,0,0.85);
  }
  #start-screen.hidden { display: none; }
  #start-btn {
    background: #4caf50;
    color: #fff;
    border: none;
    padding: 18px 48px;
    border-radius: 12px;
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #start-btn:active { background: #388e3c; }
  #start-error {
    margin-top: 16px;
    font-size: 14px;
    color: #f44336;
    text-align: center;
    padding: 0 24px;
    max-width: 400px;
  }
  #start-error.prominent {
    color: #fff;
    background: rgba(244, 67, 54, 0.22);
    border: 1px solid rgba(244, 67, 54, 0.7);
    border-radius: 8px;
    line-height: 1.4;
    padding: 12px 16px;
  }
  #start-screen.server-error .start-divider,
  #start-screen.server-error #upload-btn,
  #start-screen.server-error #upload-status {
    display: none;
  }
  #start-screen.server-error #start-btn {
    margin-top: 18px;
  }

  /* --- Settings panel --- */
  #settings-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: rgba(0,0,0,0.7);
    font-size: 13px;
    cursor: pointer;
    flex-shrink: 0;
    z-index: 10;
    -webkit-tap-highlight-color: transparent;
  }
  #settings-panel {
    display: none;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom)) 12px;
    background: rgba(0,0,0,0.85);
    font-size: 13px;
    flex-shrink: 0;
    z-index: 10;
  }
  #settings-panel.open { display: block; }
  #settings-panel label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  #settings-panel input[type="range"] { width: 120px; }
  #settings-panel select { background: #333; color: #fff; border: 1px solid #555; padding: 4px; border-radius: 4px; }
  #settings-panel .server-input {
    width: 100%;
    background: #222;
    color: #fff;
    border: 1px solid #555;
    padding: 6px 8px;
    border-radius: 4px;
    font-size: 13px;
    margin-top: 4px;
  }
  #settings-panel button {
    background: #2196f3;
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    margin-top: 4px;
  }

  /* --- Upload button --- */
  .start-divider {
    margin: 16px 0;
    font-size: 14px;
    color: #888;
  }
  #upload-btn {
    background: #2196f3;
    color: #fff;
    border: none;
    padding: 18px 48px;
    border-radius: 12px;
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #upload-btn:active { background: #1976d2; }
  #upload-btn:disabled { background: #555; cursor: default; }
  #upload-status {
    margin-top: 16px;
    font-size: 14px;
    color: #ccc;
    text-align: center;
    padding: 0 24px;
    max-width: 400px;
  }

  /* --- Results screen --- */
  #results-screen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 25;
    background: #000;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #results-screen.hidden { display: none; }
  #results-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: rgba(0,0,0,0.85);
    flex-shrink: 0;
    border-bottom: 1px solid #333;
  }
  #back-btn {
    background: #555;
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
  }
  #results-filename {
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #results-body {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* Image results */
  #result-image-wrap {
    position: relative;
    width: 100%;
    background: #111;
  }
  #result-image {
    width: 100%;
    display: block;
  }
  #result-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  #detection-list {
    padding: 12px;
  }
  .det-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 0;
    border-bottom: 1px solid #333;
  }
  .det-species {
    font-size: 16px;
    font-weight: 600;
    flex: 1;
  }
  .det-score {
    font-size: 16px;
    color: #4caf50;
    margin-left: 12px;
    flex-shrink: 0;
  }
  .det-conf {
    font-size: 12px;
    color: #888;
    margin-left: 8px;
    flex-shrink: 0;
  }
  .det-runners {
    font-size: 12px;
    color: #999;
    padding: 4px 0 0 0;
  }
  .no-detections {
    text-align: center;
    padding: 48px 24px;
    color: #888;
    font-size: 16px;
  }

  /* Video results */
  #video-info {
    padding: 12px;
    font-size: 13px;
    color: #aaa;
    border-bottom: 1px solid #333;
  }
  #video-info span { margin-right: 16px; }
  #species-list { padding: 12px; }
  .species-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #333;
  }
  .species-name {
    font-size: 16px;
    font-weight: 600;
    flex: 1;
  }
  .species-stats {
    text-align: right;
    flex-shrink: 0;
    margin-left: 12px;
  }
  .species-max {
    font-size: 16px;
    color: #4caf50;
  }
  .species-count {
    font-size: 12px;
    color: #888;
  }
  #track-list {
    padding: 0 12px 12px;
  }
  .track-header {
    font-size: 13px;
    color: #888;
    padding: 12px 0 6px;
    border-bottom: 1px solid #333;
  }
  .track-row {
    font-size: 13px;
    padding: 6px 0;
    border-bottom: 1px solid #222;
    display: flex;
    justify-content: space-between;
  }
  #copyable-results {
    padding: 12px;
    border-top: 1px solid #333;
  }
  #copyable-results.hidden { display: none; }
  #copy-results-text {
    width: 100%;
    min-height: 260px;
    resize: vertical;
    background: #111;
    color: #eee;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 10px;
    font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    line-height: 1.45;
  }
</style>
</head>
<body>

<!-- Status bar -->
<div id="status-bar">
  <span class="indicator disconnected" id="conn-indicator"></span>
  <span id="conn-text">Disconnected</span>
  <span id="gps-status"></span>
  <span style="margin-left:auto" id="latency-display"></span>
  <span id="bw-display"></span>
  <span id="fps-display"></span>
</div>

<!-- Camera + overlay -->
<div id="viewport">
  <video id="camera" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="species-log"></div>
  <button id="stream-btn" class="hidden">Start Streaming</button>
  <button id="stop-btn" class="hidden">Stop</button>
  <div id="zoom-controls" class="hidden" aria-label="Camera zoom controls">
    <button id="zoom-out-btn" type="button" aria-label="Zoom out">-</button>
    <span id="zoom-label">1.0x</span>
    <button id="zoom-in-btn" type="button" aria-label="Zoom in">+</button>
  </div>
  <div id="start-screen">
    <button id="start-btn">Start Camera</button>
    <div id="start-error"></div>
    <div class="start-divider">or</div>
    <button id="upload-btn">Upload File</button>
    <input type="file" id="file-input" accept="image/*,video/*" hidden>
    <div id="upload-status"></div>
  </div>
  <div id="results-screen" class="hidden">
    <div id="results-header">
      <button id="back-btn">&larr; Back</button>
      <span id="results-filename"></span>
    </div>
    <div id="results-body">
      <div id="image-results" class="hidden">
        <div id="result-image-wrap">
          <img id="result-image">
          <canvas id="result-canvas"></canvas>
        </div>
        <div id="detection-list"></div>
      </div>
      <div id="video-results" class="hidden">
        <div id="video-info"></div>
        <div id="species-list"></div>
        <div id="track-list"></div>
      </div>
      <div id="copyable-results" class="hidden">
        <textarea id="copy-results-text" readonly></textarea>
      </div>
    </div>
  </div>
</div>

<!-- Settings -->
<div id="settings-toggle">
  <span>Settings</span>
  <span id="settings-arrow">&#9654;</span>
</div>
<div id="settings-panel">
  <label>
    FPS: <span id="fps-value">5</span>
    <input type="range" id="fps-slider" min="1" max="10" value="5">
  </label>
  <label>
    Quality: <span id="quality-value">65%</span>
    <input type="range" id="quality-slider" min="30" max="90" value="65">
  </label>
  <label>
    Resolution
    <select id="resolution-select">
      <option value="480">480p</option>
      <option value="720" selected>720p</option>
      <option value="1080">1080p</option>
    </select>
  </label>
  <div style="margin-top: 8px;">
    <span>Server</span>
    <input type="text" id="server-input" class="server-input" placeholder="wss://10.0.0.1/ws">
    <button id="reconnect-btn">Reconnect</button>
  </div>
</div>

<script>
(function() {
  "use strict";

  // --- DOM refs ---
  const video       = document.getElementById("camera");
  const overlay     = document.getElementById("overlay");
  const ctx         = overlay.getContext("2d");
  const connInd     = document.getElementById("conn-indicator");
  const connText    = document.getElementById("conn-text");
  const gpsStatus   = document.getElementById("gps-status");
  const fpsDisplay  = document.getElementById("fps-display");
  const bwDisplay   = document.getElementById("bw-display");
  const latencyDisplay = document.getElementById("latency-display");
  const fpsSlider   = document.getElementById("fps-slider");
  const fpsValue    = document.getElementById("fps-value");
  const qualSlider  = document.getElementById("quality-slider");
  const qualValue   = document.getElementById("quality-value");
  const resoSelect  = document.getElementById("resolution-select");
  const zoomControls = document.getElementById("zoom-controls");
  const zoomOutBtn  = document.getElementById("zoom-out-btn");
  const zoomInBtn   = document.getElementById("zoom-in-btn");
  const zoomLabel   = document.getElementById("zoom-label");
  const serverInput = document.getElementById("server-input");
  const reconnBtn   = document.getElementById("reconnect-btn");
  const settToggle  = document.getElementById("settings-toggle");
  const settPanel   = document.getElementById("settings-panel");
  const settArrow   = document.getElementById("settings-arrow");
  const speciesLog     = document.getElementById("species-log");
  const streamBtn      = document.getElementById("stream-btn");
  const stopBtn        = document.getElementById("stop-btn");
  const startScreen    = document.getElementById("start-screen");
  const startBtn       = document.getElementById("start-btn");
  const startError     = document.getElementById("start-error");
  const uploadBtn      = document.getElementById("upload-btn");
  const fileInput      = document.getElementById("file-input");
  const uploadStatus   = document.getElementById("upload-status");
  const resultsScreen  = document.getElementById("results-screen");
  const backBtn        = document.getElementById("back-btn");
  const resultsFilename = document.getElementById("results-filename");
  const imageResults   = document.getElementById("image-results");
  const resultImage    = document.getElementById("result-image");
  const resultCanvas   = document.getElementById("result-canvas");
  const detectionList  = document.getElementById("detection-list");
  const videoResults   = document.getElementById("video-results");
  const videoInfo      = document.getElementById("video-info");
  const speciesList    = document.getElementById("species-list");
  const trackList      = document.getElementById("track-list");
  const copyableResults = document.getElementById("copyable-results");
  const copyResultsText = document.getElementById("copy-results-text");

  // --- State ---
  let ws            = null;
  let sendTimer     = null;
  let frameId       = 0;
  let gpsLat        = null;
  let gpsLon        = null;
  let wakeLock      = null;
  let lastDetections = [];
  let lastResultTime = 0;
  const DETECTION_TTL_MS = 2000;

  // --- Bandwidth tracking ---
  let bytesSent = 0;
  let bwTimer = null;
  let bwKbps = 0;

  // --- Latency tracking ---
  let latencyTimer = null;
  let latencyMs = 0;

  function pingServer() {
    var start = performance.now();
    fetch("/ping", { method: "GET", cache: "no-store" }).then(function(resp) {
      if (resp.ok) {
        latencyMs = Math.round(performance.now() - start);
        latencyDisplay.textContent = latencyMs + " ms";
      }
    }).catch(function() {
      latencyDisplay.textContent = "";
    });
  }

  function startLatencyTracker() {
    latencyMs = 0;
    latencyDisplay.textContent = "";
    if (latencyTimer) clearInterval(latencyTimer);
    pingServer();
    latencyTimer = setInterval(pingServer, 3000);
  }

  function stopLatencyTracker() {
    if (latencyTimer) { clearInterval(latencyTimer); latencyTimer = null; }
    latencyMs = 0;
    latencyDisplay.textContent = "";
  }

  function startBwTracker() {
    bytesSent = 0;
    bwKbps = 0;
    bwDisplay.textContent = "";
    if (bwTimer) clearInterval(bwTimer);
    bwTimer = setInterval(function() {
      bwKbps = bytesSent / 1024;
      bytesSent = 0;
      if (bwKbps > 0) {
        bwDisplay.textContent = bwKbps.toFixed(0) + " KB/s";
      }
      updateHealthIndicator();
    }, 1000);
  }

  function stopBwTracker() {
    if (bwTimer) { clearInterval(bwTimer); bwTimer = null; }
    bytesSent = 0;
    bwKbps = 0;
    bwDisplay.textContent = "";
  }

  function updateHealthIndicator() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    var targetFps = parseInt(fpsSlider.value);
    // No frames expected yet — stay green
    if (bwKbps <= 0 && targetFps <= 0) return;
    var expectedKbps = targetFps * 50; // ~50 KB avg per 720p JPEG
    if (expectedKbps <= 0) return;
    var ratio = bwKbps / expectedKbps;
    if (ratio >= 0.5) {
      connInd.className = "indicator connected";
    } else if (ratio >= 0.1) {
      connInd.className = "indicator connecting";
    } else {
      connInd.className = "indicator disconnected";
    }
  }
  const DIGITAL_MAX_ZOOM = 15;
  const ZOOM_STEP = 0.5;
  let zoomLevel = parseFloat(localStorage.getItem("bv_zoom") || "1") || 1;
  let nativeZoom = null;
  let zoomApplySeq = 0;
  let zoomHoldDelayTimer = null;
  let zoomHoldRepeatTimer = null;

  // --- Offscreen canvas for frame capture ---
  const capCanvas = document.createElement("canvas");
  const capCtx    = capCanvas.getContext("2d", { willReadFrequently: false });

  // --- Default server URL ---
  function defaultWsUrl() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    return proto + "//" + location.host + "/ws";
  }
  serverInput.value = localStorage.getItem("bv_server") || defaultWsUrl();

  // --- Settings persistence ---
  function loadSettings() {
    const fps  = localStorage.getItem("bv_fps");
    const qual = localStorage.getItem("bv_quality");
    const reso = localStorage.getItem("bv_resolution");
    const zoom = localStorage.getItem("bv_zoom");
    if (fps)  fpsSlider.value  = fps;
    if (qual) qualSlider.value = qual;
    if (reso) resoSelect.value = reso;
    if (zoom) zoomLevel = parseFloat(zoom) || 1;
    updateSettingsDisplay();
    applyZoom();
  }
  function saveSettings() {
    localStorage.setItem("bv_fps", fpsSlider.value);
    localStorage.setItem("bv_quality", qualSlider.value);
    localStorage.setItem("bv_resolution", resoSelect.value);
    localStorage.setItem("bv_zoom", String(zoomLevel));
    localStorage.setItem("bv_server", serverInput.value);
  }
  function updateSettingsDisplay() {
    fpsValue.textContent  = fpsSlider.value;
    qualValue.textContent = qualSlider.value + "%";
  }

  fpsSlider.addEventListener("input", function() {
    updateSettingsDisplay();
    saveSettings();
    restartSendLoop();
  });
  qualSlider.addEventListener("input", function() {
    updateSettingsDisplay();
    saveSettings();
  });
  resoSelect.addEventListener("change", function() {
    saveSettings();
    startCamera();
  });

  // --- Settings panel toggle ---
  settToggle.addEventListener("click", function() {
    settPanel.classList.toggle("open");
    settArrow.textContent = settPanel.classList.contains("open") ? "▼" : "▶";
  });

  // --- Camera ---
  let currentStream = null;

  function clamp(value, min, max) {
    return Math.min(Math.max(value, min), max);
  }

  function zoomMin() {
    return nativeZoom ? nativeZoom.min : 1;
  }

  function zoomMax() {
    return nativeZoom ? nativeZoom.max : DIGITAL_MAX_ZOOM;
  }

  function zoomButtonStep() {
    return ZOOM_STEP;
  }

  function roundZoom(value) {
    return Math.round(value / ZOOM_STEP) * ZOOM_STEP;
  }

  function formatZoom(value) {
    const rounded = Math.round(value);
    return (Math.abs(value - rounded) < 0.01 ? String(rounded) : value.toFixed(1)) + "x";
  }

  function updateZoomUi() {
    const min = zoomMin();
    const max = zoomMax();
    zoomLevel = clamp(roundZoom(zoomLevel), min, max);
    zoomLabel.textContent = formatZoom(zoomLevel);
    zoomOutBtn.disabled = zoomLevel <= min + 0.01;
    zoomInBtn.disabled = zoomLevel >= max - 0.01;
    zoomControls.classList.toggle("hidden", !currentStream);
  }

  function applyPreviewZoom() {
    if (nativeZoom || zoomLevel <= 1.01) {
      video.style.willChange = "";
      video.style.transform = "";
      return;
    }
    video.style.willChange = "transform";
    video.style.transform = "scale(" + zoomLevel.toFixed(3) + ")";
  }

  function setZoom(value, persist) {
    zoomLevel = clamp(roundZoom(value || 1), zoomMin(), zoomMax());
    updateZoomUi();
    applyPreviewZoom();
    if (persist) saveSettings();

    if (!nativeZoom) return;

    const seq = ++zoomApplySeq;
    nativeZoom.track.applyConstraints({ advanced: [{ zoom: zoomLevel }] }).catch(function() {
      if (seq !== zoomApplySeq) return;
      nativeZoom = null;
      zoomLevel = clamp(roundZoom(zoomLevel), 1, DIGITAL_MAX_ZOOM);
      updateZoomUi();
      applyPreviewZoom();
    });
  }

  function applyZoom() {
    setZoom(zoomLevel, false);
  }

  function setupCameraZoom(stream) {
    nativeZoom = null;
    const track = stream.getVideoTracks()[0];
    if (track && track.getCapabilities && track.applyConstraints) {
      const caps = track.getCapabilities();
      if (caps && caps.zoom && typeof caps.zoom.min === "number" && typeof caps.zoom.max === "number" && caps.zoom.max > caps.zoom.min) {
        const min = Math.max(1, Math.ceil((caps.zoom.min || 1) / ZOOM_STEP) * ZOOM_STEP);
        const max = Math.min(DIGITAL_MAX_ZOOM, Math.floor(caps.zoom.max / ZOOM_STEP) * ZOOM_STEP);
        nativeZoom = {
          track: track,
          min: min,
          max: max,
        };
        if (nativeZoom.max <= nativeZoom.min) {
          nativeZoom = null;
        }
      }
    }
    applyZoom();
  }

  function changeZoom(delta) {
    const before = zoomLevel;
    setZoom(zoomLevel + delta, true);
    return Math.abs(zoomLevel - before) > 0.01;
  }

  function stopZoomHold() {
    if (zoomHoldDelayTimer) {
      clearTimeout(zoomHoldDelayTimer);
      zoomHoldDelayTimer = null;
    }
    if (zoomHoldRepeatTimer) {
      clearInterval(zoomHoldRepeatTimer);
      zoomHoldRepeatTimer = null;
    }
  }

  function startZoomHold(delta, evt) {
    if (evt) {
      evt.preventDefault();
      if (evt.currentTarget.setPointerCapture && evt.pointerId !== undefined) {
        try {
          evt.currentTarget.setPointerCapture(evt.pointerId);
        } catch (e) {}
      }
      if (evt.currentTarget.disabled) return;
    }

    stopZoomHold();
    if (!changeZoom(delta)) return;

    zoomHoldDelayTimer = setTimeout(function() {
      zoomHoldDelayTimer = null;
      zoomHoldRepeatTimer = setInterval(function() {
        if (!changeZoom(delta)) {
          stopZoomHold();
        }
      }, 150);
    }, 350);
  }

  function bindZoomHold(button, delta) {
    button.addEventListener("pointerdown", function(evt) {
      startZoomHold(delta, evt);
    });
    button.addEventListener("pointerup", stopZoomHold);
    button.addEventListener("pointercancel", stopZoomHold);
    button.addEventListener("lostpointercapture", stopZoomHold);
    button.addEventListener("contextmenu", function(evt) {
      evt.preventDefault();
    });
  }

  bindZoomHold(zoomOutBtn, -zoomButtonStep());
  bindZoomHold(zoomInBtn, zoomButtonStep());

  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      var msg = "Camera requires a secure context (HTTPS).";
      if (location.protocol !== "https:" && location.hostname !== "localhost") {
        msg += " Try loading this page over HTTPS.";
      }
      startError.textContent = msg;
      return false;
    }
    if (currentStream) {
      currentStream.getTracks().forEach(function(t) { t.stop(); });
      currentStream = null;
      nativeZoom = null;
      updateZoomUi();
    }
    const h = parseInt(resoSelect.value);
    const videoConstraints = {
      facingMode: "environment",
      width:  { ideal: Math.round(h * 16 / 9) },
      height: { ideal: h },
    };
    if (navigator.mediaDevices.getSupportedConstraints && navigator.mediaDevices.getSupportedConstraints().zoom) {
      videoConstraints.zoom = true;
    }
    const constraints = {
      video: videoConstraints,
      audio: false,
    };
    try {
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      currentStream = stream;
      video.srcObject = stream;
      setupCameraZoom(stream);
      return true;
    } catch (err) {
      startError.textContent = "Camera error: " + err.message;
      return false;
    }
  }

  // --- Start button (opens camera + zoom controls) ---
  startBtn.addEventListener("click", async function() {
    startError.textContent = "";
    startError.classList.remove("prominent");
    startScreen.classList.remove("server-error");
    startBtn.disabled = true;
    startBtn.textContent = "Starting...";

    var ok = await startCamera();
    if (ok) {
      startScreen.classList.add("hidden");
      streamBtn.classList.remove("hidden");
      requestAnimationFrame(redrawLoop);
    } else {
      startBtn.disabled = false;
      startBtn.textContent = "Start Camera";
    }
  });

  // --- Stream button (connects WebSocket after user has zoomed) ---
  streamBtn.addEventListener("click", function() {
    streamBtn.classList.add("hidden");
    stopBtn.classList.remove("hidden");
    connectWs();
    startBwTracker();
    startLatencyTracker();
    requestWakeLock();
    startGps();
  });

  // --- Stop button (disconnects WebSocket, returns to zoom-then-stream) ---
  stopBtn.addEventListener("click", function() {
    suppressReconnect = true;
    stopSendLoop();
    stopBwTracker();
    stopLatencyTracker();
    if (ws) {
      ws.onclose = null;
      ws.close();
      ws = null;
    }
    setConnState("disconnected");
    lastDetections = [];
    lastResultTime = 0;
    ctx.clearRect(0, 0, overlay.clientWidth, overlay.clientHeight);
    speciesEntries.forEach(function(entry) { entry.el.remove(); });
    speciesEntries.clear();
    fpsDisplay.textContent = "";
    stopBtn.classList.add("hidden");
    streamBtn.classList.remove("hidden");
  });

  // --- Overlay sizing ---
  function resizeOverlay() {
    overlay.width  = overlay.clientWidth  * (window.devicePixelRatio || 1);
    overlay.height = overlay.clientHeight * (window.devicePixelRatio || 1);
    ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
  }
  window.addEventListener("resize", resizeOverlay);
  video.addEventListener("loadedmetadata", resizeOverlay);

  // --- Draw detections ---
  function videoContainRect() {
    var ew = overlay.clientWidth;
    var eh = overlay.clientHeight;
    var vw = video.videoWidth  || ew;
    var vh = video.videoHeight || eh;
    var videoAspect   = vw / vh;
    var elementAspect = ew / eh;
    var rw, rh, ox, oy;
    if (videoAspect > elementAspect) {
      rw = ew; rh = ew / videoAspect;
      ox = 0;  oy = (eh - rh) / 2;
    } else {
      rh = eh; rw = eh * videoAspect;
      ox = (ew - rw) / 2; oy = 0;
    }
    return { ox: ox, oy: oy, rw: rw, rh: rh };
  }

  function drawDetections() {
    const w = overlay.clientWidth;
    const h = overlay.clientHeight;
    ctx.clearRect(0, 0, w, h);

    const now = Date.now();
    if (now - lastResultTime > DETECTION_TTL_MS) {
      lastDetections = [];
      return;
    }

    var vr = videoContainRect();

    for (const det of lastDetections) {
      const bbox = det.bbox;
      const x1 = vr.ox + bbox[0] * vr.rw;
      const y1 = vr.oy + bbox[1] * vr.rh;
      const x2 = vr.ox + bbox[2] * vr.rw;
      const y2 = vr.oy + bbox[3] * vr.rh;
      const bw = x2 - x1;
      const bh = y2 - y1;

      // Box
      ctx.strokeStyle = "#00ff88";
      ctx.lineWidth   = 2;
      ctx.strokeRect(x1, y1, bw, bh);

      // Label
      if (det.species) {
        const label = det.species + "  " + ((det.species_score || 0) * 100).toFixed(0) + "%";
        ctx.font = "bold 14px -apple-system, sans-serif";
        const tw = ctx.measureText(label).width;
        const lx = x1;
        const ly = y1 - 4;

        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        ctx.fillRect(lx - 2, ly - 16, tw + 8, 20);
        ctx.fillStyle = "#00ff88";
        ctx.fillText(label, lx + 2, ly);
      }
    }
  }

  // --- Species log (scrolling sidebar) ---
  const SPECIES_LOG_TTL = 2000;
  const SPECIES_LOG_FADE = 600;
  const speciesEntries = new Map();

  function updateSpeciesLog(detections) {
    var now = Date.now();
    for (var i = 0; i < detections.length; i++) {
      var det = detections[i];
      if (!det.species) continue;
      var score = ((det.species_score || 0) * 100).toFixed(0);
      var key = det.species;
      var existing = speciesEntries.get(key);
      if (existing) {
        existing.time = now;
        existing.score = score;
        existing.el.textContent = det.species + "  " + score + "%";
        existing.el.classList.remove("fading");
        existing.el.style.opacity = "";
      } else {
        var el = document.createElement("div");
        el.className = "species-entry";
        el.textContent = det.species + "  " + score + "%";
        speciesLog.appendChild(el);
        speciesEntries.set(key, { el: el, time: now, score: score });
      }
    }
  }

  function pruneSpeciesLog() {
    var now = Date.now();
    speciesEntries.forEach(function(entry, key) {
      var age = now - entry.time;
      if (age > SPECIES_LOG_TTL + SPECIES_LOG_FADE) {
        entry.el.remove();
        speciesEntries.delete(key);
      } else if (age > SPECIES_LOG_TTL) {
        entry.el.classList.add("fading");
      }
    });
  }

  // --- WebSocket ---
  const BUSY_CLOSE_CODE = 1013;
  const BUSY_CLOSE_REASON = "BirdVision is already in use";
  const BUSY_MESSAGE = "BirdVision is already in use by another camera. Try again when that session disconnects.";
  let reconnectDelay = 1000;
  let suppressReconnect = false;

  function setConnState(state) {
    connInd.className = "indicator " + state;
    if (state === "connected") {
      connText.textContent = "Connected";
      reconnectDelay = 1000;
    } else if (state === "connecting") {
      connText.textContent = "Connecting...";
    } else {
      connText.textContent = "Disconnected";
    }
  }

  function connectWs() {
    const url = serverInput.value;
    if (!url) return;
    setConnState("connecting");
    suppressReconnect = false;

    try {
      ws = new WebSocket(url);
    } catch (e) {
      setConnState("disconnected");
      scheduleReconnect();
      return;
    }

    ws.binaryType = "arraybuffer";

    ws.onopen = function() {
      setConnState("connected");
      restartSendLoop();
    };

    ws.onmessage = function(evt) {
      try {
        const result = JSON.parse(evt.data);
        if (result.error) {
          showServerError(result.error);
          return;
        }
        lastDetections = result.detections || [];
        lastResultTime = Date.now();
        updateSpeciesLog(lastDetections);
        if (result.fps !== undefined) {
          fpsDisplay.textContent = result.fps.toFixed(1) + " FPS";
        }
        drawDetections();
      } catch (e) {}
    };

    ws.onclose = function(evt) {
      if (evt && (evt.code === BUSY_CLOSE_CODE || (evt.reason || "").indexOf(BUSY_CLOSE_REASON) !== -1)) {
        showServerError(BUSY_MESSAGE);
        return;
      }
      setConnState("disconnected");
      stopSendLoop();
      if (!suppressReconnect) {
        scheduleReconnect();
      }
    };

    ws.onerror = function() {
      setConnState("disconnected");
    };
  }

  function showServerError(message) {
    suppressReconnect = true;
    stopSendLoop();
    stopBwTracker();
    stopLatencyTracker();
    if (currentStream) {
      currentStream.getTracks().forEach(function(t) { t.stop(); });
      currentStream = null;
    }
    nativeZoom = null;
    zoomLevel = 1;
    video.srcObject = null;
    video.removeAttribute("src");
    video.load();
    updateZoomUi();
    applyPreviewZoom();
    lastDetections = [];
    lastResultTime = 0;
    ctx.clearRect(0, 0, overlay.clientWidth, overlay.clientHeight);
    speciesEntries.forEach(function(entry) { entry.el.remove(); });
    speciesEntries.clear();
    fpsDisplay.textContent = "";
    uploadStatus.textContent = "";
    streamBtn.classList.add("hidden");
    stopBtn.classList.add("hidden");
    startScreen.classList.add("server-error");
    startScreen.classList.remove("hidden");
    startError.textContent = message;
    startError.classList.add("prominent");
    startBtn.disabled = false;
    startBtn.textContent = "Try Again";
    setConnState("disconnected");
    connText.textContent = "In use";
  }

  function scheduleReconnect() {
    setTimeout(function() {
      if (!ws || ws.readyState === WebSocket.CLOSED) {
        connectWs();
      }
    }, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 1.5, 10000);
  }

  reconnBtn.addEventListener("click", function() {
    saveSettings();
    if (ws) {
      ws.onclose = null;
      ws.close();
    }
    reconnectDelay = 1000;
    connectWs();
  });

  // --- Frame sending ---
  function sendFrame() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    if (video.readyState < 2) return;

    const vw = video.videoWidth;
    const vh = video.videoHeight;
    if (!vw || !vh) return;

    capCanvas.width  = vw;
    capCanvas.height = vh;
    if (nativeZoom || zoomLevel <= 1.01) {
      capCtx.drawImage(video, 0, 0, vw, vh);
    } else {
      const cropW = vw / zoomLevel;
      const cropH = vh / zoomLevel;
      const cropX = (vw - cropW) / 2;
      const cropY = (vh - cropH) / 2;
      capCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, vw, vh);
    }

    const quality = parseInt(qualSlider.value) / 100;
    capCanvas.toBlob(function(blob) {
      if (!blob || !ws || ws.readyState !== WebSocket.OPEN) return;

      const meta = { frame_id: frameId };
      if (gpsLat !== null && gpsLon !== null) {
        meta.lat = gpsLat;
        meta.lon = gpsLon;
      }
      ws.send(JSON.stringify(meta));

      blob.arrayBuffer().then(function(buf) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(buf);
          bytesSent += buf.byteLength;
          frameId++;
        }
      });
    }, "image/jpeg", quality);
  }

  function restartSendLoop() {
    stopSendLoop();
    const interval = 1000 / parseInt(fpsSlider.value);
    sendTimer = setInterval(sendFrame, interval);
  }

  function stopSendLoop() {
    if (sendTimer) {
      clearInterval(sendTimer);
      sendTimer = null;
    }
  }

  // --- GPS ---
  function startGps() {
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        function(pos) {
          gpsLat = pos.coords.latitude;
          gpsLon = pos.coords.longitude;
          gpsStatus.textContent = "📍 GPS";
        },
        function() {
          gpsStatus.textContent = "📍 No GPS";
        },
        { enableHighAccuracy: true, maximumAge: 10000 }
      );
    }
  }

  // --- Wake Lock ---
  async function requestWakeLock() {
    if ("wakeLock" in navigator) {
      try {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", function() { wakeLock = null; });
      } catch (e) {}
    }
  }
  document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === "visible") {
      requestWakeLock();
    }
  });

  // --- Redraw loop (for TTL fading) ---
  function redrawLoop() {
    drawDetections();
    pruneSpeciesLog();
    requestAnimationFrame(redrawLoop);
  }

  // --- Upload ---
  uploadBtn.addEventListener("click", function() {
    fileInput.click();
  });

  fileInput.addEventListener("change", function() {
    var file = fileInput.files[0];
    if (!file) return;
    uploadFile(file);
    fileInput.value = "";
  });

  function uploadFile(file) {
    var formData = new FormData();
    formData.append("file", file);

    uploadBtn.disabled = true;
    uploadStatus.textContent = "Uploading...";
    uploadStatus.style.color = "#ccc";

    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/upload");

    xhr.upload.onprogress = function(e) {
      if (e.lengthComputable) {
        var pct = Math.round(e.loaded / e.total * 100);
        uploadStatus.textContent = "Uploading... " + pct + "%";
      }
    };

    xhr.upload.onload = function() {
      uploadStatus.textContent = "Identifying birds...";
    };

    xhr.onload = function() {
      uploadBtn.disabled = false;
      if (xhr.status === 200) {
        try {
          var result = JSON.parse(xhr.responseText);
          if (result.error) {
            uploadStatus.textContent = "Error: " + result.error;
            uploadStatus.style.color = "#f44336";
          } else {
            uploadStatus.textContent = "";
            showResults(result, file);
          }
        } catch (e) {
          uploadStatus.textContent = "Invalid response from server";
          uploadStatus.style.color = "#f44336";
        }
      } else {
        uploadStatus.textContent = "Upload failed: " + xhr.status;
        uploadStatus.style.color = "#f44336";
      }
    };

    xhr.onerror = function() {
      uploadBtn.disabled = false;
      uploadStatus.textContent = "Upload failed — check connection";
      uploadStatus.style.color = "#f44336";
    };

    xhr.send(formData);
  }

  // --- Results display ---
  function showResults(data, file) {
    resultsFilename.textContent = data.filename || file.name;
    imageResults.classList.add("hidden");
    videoResults.classList.add("hidden");
    copyableResults.classList.add("hidden");

    if (data.type === "image") {
      showImageResults(data, file);
    } else {
      showVideoResults(data);
    }
    showCopyableResults(data);

    startScreen.classList.add("hidden");
    resultsScreen.classList.remove("hidden");
  }

  function showImageResults(data, file) {
    var url = URL.createObjectURL(file);
    resultImage.onload = function() {
      drawResultDetections(data.detections, resultImage, resultCanvas);
      URL.revokeObjectURL(url);
    };
    resultImage.src = url;

    detectionList.innerHTML = "";
    if (!data.detections || data.detections.length === 0) {
      detectionList.innerHTML = '<div class="no-detections">No birds detected</div>';
    } else {
      for (var i = 0; i < data.detections.length; i++) {
        var det = data.detections[i];
        var row = document.createElement("div");

        var main = document.createElement("div");
        main.className = "det-row";
        var sp = document.createElement("span");
        sp.className = "det-species";
        sp.textContent = det.species;
        var sc = document.createElement("span");
        sc.className = "det-score";
        sc.textContent = (det.species_score * 100).toFixed(0) + "%";
        var cf = document.createElement("span");
        cf.className = "det-conf";
        cf.textContent = "det " + (det.confidence * 100).toFixed(0) + "%";
        main.appendChild(sp);
        main.appendChild(sc);
        main.appendChild(cf);
        row.appendChild(main);

        if (det.top_predictions && det.top_predictions.length > 1) {
          var runners = document.createElement("div");
          runners.className = "det-runners";
          var parts = [];
          for (var j = 1; j < Math.min(det.top_predictions.length, 4); j++) {
            parts.push(det.top_predictions[j][0] + " " + (det.top_predictions[j][1] * 100).toFixed(1) + "%");
          }
          runners.textContent = parts.join(" · ");
          row.appendChild(runners);
        }
        detectionList.appendChild(row);
      }
    }
    imageResults.classList.remove("hidden");
  }

  function drawResultDetections(detections, img, canvas) {
    var dpr = window.devicePixelRatio || 1;
    var w = img.clientWidth;
    var h = img.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    var c = canvas.getContext("2d");
    c.scale(dpr, dpr);

    for (var i = 0; i < detections.length; i++) {
      var det = detections[i];
      var bbox = det.bbox;
      var x1 = bbox[0] * w;
      var y1 = bbox[1] * h;
      var x2 = bbox[2] * w;
      var y2 = bbox[3] * h;
      var bw = x2 - x1;
      var bh = y2 - y1;

      c.strokeStyle = "#00ff88";
      c.lineWidth = 2;
      c.strokeRect(x1, y1, bw, bh);

      if (det.species) {
        var label = det.species + "  " + (det.species_score * 100).toFixed(0) + "%";
        c.font = "bold 14px -apple-system, sans-serif";
        var tw = c.measureText(label).width;
        c.fillStyle = "rgba(0, 0, 0, 0.6)";
        c.fillRect(x1 - 2, y1 - 20, tw + 8, 22);
        c.fillStyle = "#00ff88";
        c.fillText(label, x1 + 2, y1 - 4);
      }
    }
  }

  function showVideoResults(data) {
    var parts = [];
    parts.push("<span>" + data.duration_seconds + "s</span>");
    parts.push("<span>" + data.width + "x" + data.height + "</span>");
    parts.push("<span>" + data.native_fps + " fps</span>");
    parts.push("<span>" + data.processed_frames + " frames</span>");
    parts.push("<span>" + data.processing_seconds + "s processing @ " + data.processing_fps + " fps</span>");
    videoInfo.innerHTML = parts.join("");

    speciesList.innerHTML = "";
    if (!data.species_summary || data.species_summary.length === 0) {
      speciesList.innerHTML = '<div class="no-detections">No birds detected</div>';
    } else {
      for (var i = 0; i < data.species_summary.length; i++) {
        var sp = data.species_summary[i];
        var row = document.createElement("div");
        row.className = "species-row";
        var name = document.createElement("span");
        name.className = "species-name";
        name.textContent = sp.species;
        var stats = document.createElement("div");
        stats.className = "species-stats";
        var mx = document.createElement("div");
        mx.className = "species-max";
        mx.textContent = (sp.max_confidence * 100).toFixed(0) + "%";
        var ct = document.createElement("div");
        ct.className = "species-count";
        ct.textContent = sp.detection_count + " detection" + (sp.detection_count !== 1 ? "s" : "") + ", avg " + (sp.avg_confidence * 100).toFixed(0) + "%";
        stats.appendChild(mx);
        stats.appendChild(ct);
        row.appendChild(name);
        row.appendChild(stats);
        speciesList.appendChild(row);
      }
    }

    trackList.innerHTML = "";
    if (data.tracks && data.tracks.length > 0) {
      trackList.innerHTML = '<div class="track-header">Tracks (' + data.tracks.length + ')</div>';
      for (var i = 0; i < data.tracks.length; i++) {
        var t = data.tracks[i];
        var row = document.createElement("div");
        row.className = "track-row";
        row.innerHTML = "<span>#" + t.track_id + " " + t.top_species + " " + (t.confidence * 100).toFixed(0) + "%</span>" +
          "<span>frames " + t.frame_span[0] + "-" + t.frame_span[1] + " (" + t.classification_count + " cls)</span>";
        trackList.appendChild(row);
      }
    }
    videoResults.classList.remove("hidden");
  }

  function pct(value, digits) {
    var n = Number(value || 0) * 100;
    return n.toFixed(digits == null ? 1 : digits) + "%";
  }

  function pad(value, width) {
    value = String(value == null ? "" : value);
    return value.length >= width ? value : value + " ".repeat(width - value.length);
  }

  function buildCopyableResults(data) {
    var lines = [];
    lines.push("File: " + (data.filename || "upload"));
    lines.push("");

    if (data.type === "image") {
      lines.push("Image: " + (data.width || "?") + "x" + (data.height || "?"));
      lines.push("");
      if (!data.detections || data.detections.length === 0) {
        lines.push("No birds detected");
      } else {
        lines.push("DETECTIONS");
        lines.push(pad("#", 4) + pad("species", 28) + pad("prob", 10) + "detector");
        lines.push(pad("-", 4) + pad("-------", 28) + pad("----", 10) + "--------");
        for (var i = 0; i < data.detections.length; i++) {
          var det = data.detections[i];
          lines.push(
            pad(i, 4) +
            pad(det.species || "unknown", 28) +
            pad(pct(det.species_score, 1), 10) +
            pct(det.confidence, 1)
          );
          if (det.top_predictions && det.top_predictions.length > 0) {
            lines.push("");
            lines.push("Detection " + i + " top predictions:");
            for (var j = 0; j < det.top_predictions.length; j++) {
              lines.push(
                "  " +
                pad(j + 1, 4) +
                pad(det.top_predictions[j][0], 28) +
                pct(det.top_predictions[j][1], 1)
              );
            }
            lines.push("");
          }
        }
      }
    } else {
      lines.push("Video: " +
        (data.duration_seconds || 0) + "s, " +
        (data.width || "?") + "x" + (data.height || "?") + ", " +
        (data.native_fps || 0) + " fps"
      );
      lines.push(
        "Processed: " +
        (data.processed_frames || 0) + " frames in " +
        (data.processing_seconds || 0) + "s @ " +
        (data.processing_fps || 0) + " fps"
      );
      lines.push("");
      if (!data.species_summary || data.species_summary.length === 0) {
        lines.push("No birds detected");
      } else {
        lines.push("SPECIES");
        lines.push(pad("#", 4) + pad("species", 28) + pad("max", 10) + pad("avg", 10) + "detections");
        lines.push(pad("-", 4) + pad("-------", 28) + pad("---", 10) + pad("---", 10) + "----------");
        for (var k = 0; k < data.species_summary.length; k++) {
          var sp = data.species_summary[k];
          lines.push(
            pad(k + 1, 4) +
            pad(sp.species, 28) +
            pad(pct(sp.max_confidence, 1), 10) +
            pad(pct(sp.avg_confidence, 1), 10) +
            sp.detection_count
          );
        }
      }
      if (data.tracks && data.tracks.length > 0) {
        lines.push("");
        lines.push("TRACKS (" + data.tracks.length + ")");
        lines.push(pad("id", 4) + pad("species", 28) + pad("prob", 10) + pad("frames", 14) + "classifications");
        lines.push(pad("--", 4) + pad("-------", 28) + pad("----", 10) + pad("------", 14) + "---------------");
        for (var m = 0; m < data.tracks.length; m++) {
          var t = data.tracks[m];
          lines.push(
            pad(t.track_id, 4) +
            pad(t.top_species, 28) +
            pad(pct(t.confidence, 1), 10) +
            pad(t.frame_span[0] + "-" + t.frame_span[1], 14) +
            t.classification_count
          );
        }
      }
    }
    return lines.join("\n");
  }

  function showCopyableResults(data) {
    copyResultsText.value = buildCopyableResults(data);
    copyableResults.classList.remove("hidden");
  }

  copyResultsText.addEventListener("focus", function() {
    copyResultsText.select();
  });

  backBtn.addEventListener("click", function() {
    resultsScreen.classList.add("hidden");
    startScreen.classList.remove("hidden");
    resultImage.src = "";
  });

  // --- Init ---
  loadSettings();

})();
</script>
