services:
  birdvision-pi:
    profiles: ["backyard"]
    build:
      context: .
      dockerfile: Dockerfile.pi
    image: birdvision-pi:latest
    restart: unless-stopped
    stop_grace_period: 30s

    # Device passthrough — all three must be present on the host
    devices:
      - /dev/hailo0:/dev/hailo0   # Hailo-8 PCIe AI accelerator
      - /dev/video0:/dev/video0   # Elgato Cam Link 4K — primary capture node
      - /dev/video1:/dev/video1   # Elgato Cam Link 4K — metadata/control node
      - /dev/fb0:/dev/fb0         # Pi Touch Display 2 framebuffer (overlay)

    # Device group access.
    # /dev/hailo0 is crw-rw-rw- (world r/w) — no group needed.
    # /dev/video0 is crw-rw---- owned by group 'video' — add it here.
    # Both host and container are ubuntu:24.04, so group names resolve correctly.
    group_add:
      - "video"

    volumes:
      # Config file (read-only)
      - ./config.pi.yaml:/app/config.pi.yaml:ro
      # HEF model files + species labels (gitignored, download separately)
      - ./pi/models:/app/pi/models:ro
      # Results output (writable)
      - ./results:/data/results
      # System stats (temperature, fan, freq) — read-only host sysfs
      - /sys/class/thermal:/sys/class/thermal:ro
      - /sys/class/hwmon:/sys/class/hwmon:ro

    environment:
      - PYTHONUNBUFFERED=1

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Phone sidecar — accepts camera frames from a phone browser over WebSocket.
  # Uses the same image as birdvision-pi but with a different config and no
  # USB capture devices. Only one service can run at a time (Hailo is exclusive).
  #
  # Backyard:  docker compose -f docker-compose.pi.yml --profile backyard up
  # Sidecar:   docker compose -f docker-compose.pi.yml --profile sidecar up
  birdvision-sidecar:
    profiles: ["sidecar"]
    build:
      context: .
      dockerfile: Dockerfile.pi
    image: birdvision-pi:latest
    restart: unless-stopped
    stop_grace_period: 30s

    devices:
      - /dev/hailo0:/dev/hailo0   # Hailo-8 PCIe AI accelerator

    # Publish the Starlette sidecar app for the home nginx reverse proxy.
    # Caddy still handles direct phone HTTPS on ports 80/443.
    ports:
      - "8765:8765"

    expose:
      - "8765"

    volumes:
      - ./config.pi.sidecar.yaml:/app/config.pi.yaml:ro
      - ./pi/models:/app/pi/models:ro
      - ./results:/data/results
      - /sys/class/thermal:/sys/class/thermal:ro
      - /sys/class/hwmon:/sys/class/hwmon:ro

    environment:
      - PYTHONUNBUFFERED=1

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # TLS reverse proxy for sidecar — phones require HTTPS for camera access.
  # Caddy auto-generates a self-signed certificate on first start.
  caddy:
    profiles: ["sidecar"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"    # HTTPS (TLS termination → birdvision-sidecar:8765)
      - "80:80"      # HTTP redirect → HTTPS
    volumes:
      - ./Caddyfile.sidecar:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - birdvision-sidecar

volumes:
  caddy_data:
  caddy_config:
